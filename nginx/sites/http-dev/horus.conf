# DEVELOPMENT / ISOLATED LAB ONLY (HORUS_PROXY_MODE=http-dev): plain HTTP on 8080 (host 80), no TLS, no HSTS.
# Login cookies are not Secure in this mode. Never use it on a network you do not fully control.
include /etc/nginx/common/upstreams.inc;

map $scheme $horus_hsts { default ""; }

server {
    listen 8080 default_server;
    server_name _;
    include /etc/nginx/common/locations.inc;
}
