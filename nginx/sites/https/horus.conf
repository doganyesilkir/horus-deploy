# PRODUCTION mode (HORUS_PROXY_MODE=https, default): HTTPS on 8443 (host 443), HTTP 8080 (host 80) only redirects.
# Certificate: nginx/certs/fullchain.pem + nginx/certs/privkey.pem (scripts/install.sh can create a temporary
# self-signed pair; replace it with a CA-issued certificate).
include /etc/nginx/common/upstreams.inc;

map $scheme $horus_hsts { default "max-age=31536000; includeSubDomains"; }

server {
    listen 8080 default_server;
    server_name _;
    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:horus_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security $horus_hsts always;
    include /etc/nginx/common/locations.inc;
}
