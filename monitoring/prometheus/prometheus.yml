global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: horus

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: horus-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: horus-worker
    static_configs:
      - targets: ["worker:9808"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["grafana:3000"]
